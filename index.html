
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PORTAL MAYHEM 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;color:white;font-family:Arial}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#top{display:flex;justify-content:space-between;padding:12px}
.panel{background:#101c20dd;border:1px solid #45ef91;border-radius:12px;padding:10px}
#bottom{position:absolute;bottom:15px;width:100%;display:flex;justify-content:space-between;padding:0 18px;align-items:end}
button{pointer-events:auto;background:#15372b;color:white;border:2px solid #39e98b;border-radius:12px;padding:13px;font-weight:bold}
#stick{width:125px;height:125px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff66;position:relative;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:48px;height:48px;left:36px;top:36px;background:#49ed91aa;border-radius:50%}
#actions{display:flex;flex-direction:column;gap:9px}
#message{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:#101c20dd;padding:10px;border-radius:10px}
#menu{position:absolute;inset:0;background:#05090bee;display:none;align-items:center;justify-content:center;pointer-events:auto}
#menuBox{width:90%;max-width:350px;background:#13231f;border:2px solid #43ec91;border-radius:18px;padding:20px;text-align:center}
#menuBox button{display:block;width:100%;margin:9px 0}
</style>
</head>
<body>
<div id="ui">
 <div id="top">
  <div class="panel">PORTAL MAYHEM 3D<br><small>MULTIVERSE EXPLORER</small></div>
  <div class="panel" id="world">WORLD: NORMAL</div>
 </div>
 <div id="message">WORLD создаёт портал</div>
 <div id="bottom">
  <div id="stick"><div id="knob"></div></div>
  <div id="actions">
   <button id="jump">ПРЫЖОК</button>
   <button id="worldbtn">WORLD</button>
   <button id="menuBtn">МИРЫ</button>
  </div>
 </div>
</div>
<div id="menu">
 <div id="menuBox">
  <h2>ВЫБОР ВСЕЛЕННОЙ</h2>
  <button data-world="0">NORMAL</button>
  <button data-world="1">RICK AND MORTY</button>
  <button data-world="2">MINECRAFT</button>
  <button data-world="3">SPACE</button>
  <button id="close">ЗАКРЫТЬ</button>
 </div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x17252d);
scene.fog=new THREE.Fog(0x17252d,20,75);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,150);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x344455,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(8,15,8);
sun.castShadow=true;
scene.add(sun);

const worlds=[
 {name:"NORMAL",bg:0x17252d,floor:0x46515b,portal:0x35ff91},
 {name:"RICK AND MORTY",bg:0x101a21,floor:0x304d40,portal:0x39ff27},
 {name:"MINECRAFT",bg:0x70b9ed,floor:0x388b36,portal:0x25eaff},
 {name:"SPACE",bg:0x08051c,floor:0x28234c,portal:0xb54cff}
];

let worldIndex=0;
let portal=null;
let portalTarget=0;
let verticalSpeed=0;
let grounded=true;
let oldZ=0;
let moving={x:0,z:0};

const player=new THREE.Group();
scene.add(player);

const body=new THREE.Mesh(
 new THREE.BoxGeometry(.65,1,.4),
 new THREE.MeshStandardMaterial({color:0xe6e6e6})
);
body.position.y=.85;
body.castShadow=true;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.28,16,16),
 new THREE.MeshStandardMaterial({color:0xe7c6a5})
);
head.position.y=1.55;
player.add(head);

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),
 new THREE.MeshStandardMaterial({color:worlds[0].floor})
);
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const objects=new THREE.Group();
scene.add(objects);

function clearObjects(){
 while(objects.children.length){
  const o=objects.children.pop();
  o.geometry?.dispose();
  if(o.material){
   if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());
   else o.material.dispose();
  }
 }
}

function buildWorld(){
 scene.background.setHex(worlds[worldIndex].bg);
 scene.fog.color.setHex(worlds[worldIndex].bg);
 floor.material.color.setHex(worlds[worldIndex].floor);
 clearObjects();

 if(worldIndex===2){
  for(let x=-20;x<=20;x+=4){
   for(let z=-20;z<=20;z+=4){
    const h=1+Math.random()*3;
    const block=new THREE.Mesh(
     new THREE.BoxGeometry(2,h,2),
     new THREE.MeshStandardMaterial({
      color:[0x397e35,0x725038,0x438a40][Math.floor(Math.random()*3)]
     })
    );
    block.position.set(x,h/2,z);
    block.castShadow=true;
    objects.add(block);
   }
  }
 }else{
  for(let i=0;i<35;i++){
   const h=1+Math.random()*5;
   const box=new THREE.Mesh(
    new THREE.BoxGeometry(1.5,h,1.5),
    new THREE.MeshStandardMaterial({
     color:worldIndex===3?0x39305c:0x34454c
    })
   );
   box.position.set(
    (Math.random()-.5)*65,
    h/2,
    (Math.random()-.5)*65
   );
   box.castShadow=true;
   objects.add(box);
  }
 }

 if(worldIndex===3){
  for(let i=0;i<100;i++){
   const star=new THREE.Mesh(
    new THREE.SphereGeometry(.06,5,5),
    new THREE.MeshBasicMaterial({color:0xffffff})
   );
   star.position.set(
    (Math.random()-.5)*90,
    Math.random()*30+2,
    (Math.random()-.5)*90
   );
   objects.add(star);
  }
 }
}

buildWorld();

function createPortal(){
 if(portal)return;
 portalTarget=(worldIndex+1)%worlds.length;

 const group=new THREE.Group();
 const color=worlds[portalTarget].portal;

 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(1,0.12,12,48),
  new THREE.MeshStandardMaterial({
   color,emissive:color,emissiveIntensity:2
  })
 );
 ring.scale.set(.85,1.8,1);
 group.add(ring);

 const inside=new THREE.Mesh(
  new THREE.CircleGeometry(.85,48),
  new THREE.MeshBasicMaterial({
   color,transparent:true,opacity:.3,
   side:THREE.DoubleSide
  })
 );
 inside.scale.y=1.8;
 inside.position.z=-.03;
 group.add(inside);

 group.position.set(
  player.position.x,
  1.8,
  player.position.z-5
 );
 group.userData.ring=ring;
 scene.add(group);
 portal=group;
 document.getElementById("message").textContent=
 "Портал открыт: "+worlds[portalTarget].name;
}

function changeWorld(){
 worldIndex=portalTarget;
 buildWorld();
 document.getElementById("world").textContent=
 "WORLD: "+worlds[worldIndex].name;
 player.position.set(0,0,0);
 verticalSpeed=0;
 grounded=true;
 scene.remove(portal);
 portal=null;
 document.getElementById("message").textContent=
 "Добро пожаловать: "+worlds[worldIndex].name;
 localStorage.setItem("portalWorld",worldIndex);
}

const menu=document.getElementById("menu");
document.getElementById("worldbtn").onclick=()=>{
 if(!portal)createPortal();
};
document.getElementById("menuBtn").onclick=()=>{
 menu.style.display="flex";
};
document.getElementById("close").onclick=()=>{
 menu.style.display="none";
};
document.querySelectorAll("[data-world]").forEach(btn=>{
 btn.onclick=()=>{
  portalTarget=Number(btn.dataset.world);
  menu.style.display="none";
  if(portal)scene.remove(portal);
  portal=null;
  createPortal();
 };
});

function jump(){
 if(grounded){
  verticalSpeed=7;
  grounded=false;
 }
}
document.getElementById("jump").onclick=jump;

const stick=document.getElementById("stick");
const knob=document.getElementById("knob");
let pointer=null;

stick.addEventListener("pointerdown",e=>{
 pointer=e.pointerId;
 stick.setPointerCapture(pointer);
 updateStick(e);
});
stick.addEventListener("pointermove",e=>{
 if(e.pointerId===pointer)updateStick(e);
});
function updateStick(e){
 const r=stick.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const length=Math.hypot(x,y);
 if(length>38){x*=38/length;y*=38/length;}
 knob.style.left=(36+x)+"px";
 knob.style.top=(36+y)+"px";
 moving.x=x/38;
 moving.z=y/38;
}
function release(){
 pointer=null;
 moving={x:0,z:0};
 knob.style.left="36px";
 knob.style.top="36px";
}
stick.addEventListener("pointerup",release);
stick.addEventListener("pointercancel",release);

const keys={};
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==="Space")jump();
 if(e.key.toLowerCase()==="e")createPortal();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let previous=performance.now();

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-previous)/1000,.04);
 previous=now;

 let dx=moving.x;
 let dz=moving.z;
 if(keys.w||keys.arrowup)dz-=1;
 if(keys.s||keys.arrowdown)dz+=1;
 if(keys.a||keys.arrowleft)dx-=1;
 if(keys.d||keys.arrowright)dx+=1;

 const length=Math.hypot(dx,dz);
 if(length>1){dx/=length;dz/=length;}

 player.position.x+=dx*5*dt;
 player.position.z+=dz*5*dt;
 if(length>.05)player.rotation.y=Math.atan2(dx,dz);

 verticalSpeed-=18*dt;
 player.position.y+=verticalSpeed*dt;
 if(player.position.y<=0){
  player.position.y=0;
  verticalSpeed=0;
  grounded=true;
 }

 if(portal){
  portal.userData.ring.rotation.z+=dt*.6;
  const p=portal.position;
  const dist=Math.hypot(
   player.position.x-p.x,
   player.position.z-p.z
  );
  if(dist<1.05 && Math.abs(player.position.y)<.6){
   changeWorld();
  }
 }

 const cameraTarget=new THREE.Vector3(
  player.position.x,
  player.position.y+3,
  player.position.z+7
 );
 camera.position.lerp(cameraTarget,.12);
 camera.lookAt(
  player.position.x,
  player.position.y+1,
  player.position.z-2
 );

 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
