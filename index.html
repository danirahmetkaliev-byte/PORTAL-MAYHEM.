
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PORTAL MAYHEM</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080b16;color:white;font-family:Arial}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#title{position:absolute;top:15px;width:100%;text-align:center;font-size:23px;font-weight:bold;text-shadow:0 0 12px #00ff88}
#world{position:absolute;top:48px;width:100%;text-align:center;font-size:13px}
#joy{position:absolute;bottom:35px;left:25px;width:125px;height:125px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff88;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:48px;height:48px;left:36px;top:36px;border-radius:50%;background:#00ff99aa}
.control{position:absolute;right:25px;width:75px;height:75px;border-radius:50%;background:#00aa9977;border:2px solid #00ffcc;pointer-events:auto;color:white;font-weight:bold}
#jump{bottom:35px}
#change{bottom:125px}
#hint{position:absolute;bottom:12px;width:100%;text-align:center;font-size:11px;color:#ddd}
</style>
</head>
<body>
<div id="ui">
<div id="title">PORTAL MAYHEM</div>
<div id="world">ВСЕЛЕННАЯ: GREEN WORLD</div>
<div id="joy"><div id="stick"></div></div>
<button class="control" id="jump">JUMP</button>
<button class="control" id="change">WORLD</button>
<div id="hint">Двигай джойстик • JUMP — прыжок • WORLD — смена мира</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x081b19);
scene.fog = new THREE.Fog(0x081b19,25,90);

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,300);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x335544,2));
const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(10,20,10);
light.castShadow=true;
scene.add(light);

const worlds=[
{ name:'GREEN WORLD', bg:0x081b19, floor:0x174c36, glow:0x00ff88 },
{ name:'SPACE WORLD', bg:0x090b29, floor:0x25275c, glow:0x7777ff },
{ name:'FIRE WORLD', bg:0x35100a, floor:0x74301b, glow:0xff6633 },
{ name:'ICE WORLD', bg:0x102b42, floor:0x5799bb, glow:0x66ddff },
{ name:'VOID WORLD', bg:0x171020, floor:0x30203e, glow:0xdd66ff }
];
let worldIndex=0;

const floorMat=new THREE.MeshStandardMaterial({color:worlds[0].floor});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),floorMat);
floor.rotation.x=-Math.PI/2;
floor.position.y=-0.1;
floor.receiveShadow=true;
scene.add(floor);

const grid=new THREE.GridHelper(200,100,0x00ff99,0x245044);
grid.position.y=0;
scene.add(grid);

// Floating platforms
for(let i=0;i<12;i++){
 const p=new THREE.Mesh(
  new THREE.BoxGeometry(3,0.5,3),
  new THREE.MeshStandardMaterial({color:0x285b50})
 );
 p.position.set(Math.sin(i*1.7)*12,1+(i%3),-8-i*5);
 p.castShadow=true;
 scene.add(p);
}

// Character
const player=new THREE.Group();
const body=new THREE.Mesh(
 new THREE.BoxGeometry(0.8,1.2,0.5),
 new THREE.MeshStandardMaterial({color:0x00cc88})
);
body.position.y=1.2;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(0.36,20,20),
 new THREE.MeshStandardMaterial({color:0xd9f5df})
);
head.position.y=2;
player.add(head);

player.position.set(0,0,5);
scene.add(player);

// Portals
function makePortal(x,z,color){
 const group=new THREE.Group();
 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(1.25,0.12,16,64),
  new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:2})
 );
 group.add(ring);
 const center=new THREE.Mesh(
  new THREE.CircleGeometry(1.15,48),
  new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.22,side:THREE.DoubleSide})
 );
 center.position.z=-0.03;
 group.add(center);
 group.position.set(x,1.6,z);
 scene.add(group);
 return group;
}
const portalA=makePortal(-6,-12,0x00ff88);
const portalB=makePortal(6,-12,0x00ccff);

let velocityY=0;
let onGround=true;
let moveX=0,moveZ=0;
let lastTeleport=0;

function jump(){
 if(onGround){
  velocityY=0.19;
  onGround=false;
 }
}
document.getElementById('jump').addEventListener('pointerdown',jump);

document.getElementById('change').addEventListener('pointerdown',()=>{
 worldIndex=(worldIndex+1)%worlds.length;
 const w=worlds[worldIndex];
 scene.background.setHex(w.bg);
 scene.fog.color.setHex(w.bg);
 floorMat.color.setHex(w.floor);
 grid.material.color.setHex(w.glow);
 document.getElementById('world').textContent='ВСЕЛЕННАЯ: '+w.name;
});

// Joystick
const joy=document.getElementById('joy');
const stick=document.getElementById('stick');
let joyPointer=null;

joy.addEventListener('pointerdown',e=>{
 joyPointer=e.pointerId;
 joy.setPointerCapture(e.pointerId);
 updateJoy(e);
});
joy.addEventListener('pointermove',e=>{
 if(e.pointerId===joyPointer)updateJoy(e);
});
function updateJoy(e){
 const r=joy.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 const length=Math.hypot(x,y);
 if(length>40){x=x/length*40;y=y/length*40}
 stick.style.left=(36+x)+'px';
 stick.style.top=(36+y)+'px';
 moveX=x/40;
 moveZ=y/40;
}
function releaseJoy(){
 joyPointer=null;
 moveX=0;moveZ=0;
 stick.style.left='36px';
 stick.style.top='36px';
}
joy.addEventListener('pointerup',releaseJoy);
joy.addEventListener('pointercancel',releaseJoy);

// Keyboard
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')jump()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function animate(){
 requestAnimationFrame(animate);

 const speed=0.13;
 const dx=moveX+(keys['d']?1:0)-(keys['a']?1:0);
 const dz=moveZ+(keys['s']?1:0)-(keys['w']?1:0);

 player.position.x+=dx*speed;
 player.position.z+=dz*speed;

 if(Math.abs(dx)+Math.abs(dz)>0.05){
  player.rotation.y=Math.atan2(dx,dz);
 }

 velocityY-=0.009;
 player.position.y+=velocityY;
 if(player.position.y<0){
  player.position.y=0;
  velocityY=0;
  onGround=true;
 }

 // Portal teleport
 const now=Date.now();
 if(now-lastTeleport>1300){
  if(player.position.distanceTo(portalA.position)<1.6){
   player.position.set(6,0,-10);
   lastTeleport=now;
  }else if(player.position.distanceTo(portalB.position)<1.6){
   player.position.set(-6,0,-10);
   lastTeleport=now;
  }
 }

 // Camera follows player
 const target=new THREE.Vector3(
  player.position.x,
  player.position.y+3,
  player.position.z+7
 );
 camera.position.lerp(target,0.08);
 camera.lookAt(player.position.x,player.position.y+1,player.position.z-2);

 portalA.rotation.z=Math.sin(now*0.002)*0.08;
 portalB.rotation.z=-Math.sin(now*0.002)*0.08;

 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
